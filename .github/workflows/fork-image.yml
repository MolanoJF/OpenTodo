# Fork-only: builds the deploy branch (upstream release + unmerged calendar-event changes) for the home lab. Not for upstream.
name: Fork image

on:
  push:
    branches: [home-deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)-cal.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=dev
            SOURCE_COMMIT=${{ github.sha }}
            OPENTODO_BUILD=preview
          tags: |
            ghcr.io/molanojf/opentodo:${{ steps.tag.outputs.tag }}
            ghcr.io/molanojf/opentodo:home-deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
